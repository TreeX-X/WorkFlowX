<!doctype html>
<!-- Note: .agents/notes/distribution/requirements/readme-demo.md -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WorkflowX README Visuals</title>
  <style>
    :root {
      --bg: #000000;
      --ink: #f8f8f6;
      --soft: #d6d0c8;
      --muted: #88837c;
      --faint: #4d4943;
      --line: rgba(255, 255, 255, 0.13);
      --line-soft: rgba(255, 255, 255, 0.07);
      --panel: #050505;
      --panel-2: #090909;
      --panel-3: #0d0d0d;
      --accent: #ff6428;
      --accent-soft: rgba(255, 100, 40, 0.13);
      --ok: #d7e6dc;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 1200px;
      height: 675px;
      margin: 0;
      overflow: hidden;
      background: #000000;
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    #stage {
      position: relative;
      width: 1200px;
      height: 675px;
      overflow: hidden;
      background: #000000;
    }

    .frame {
      position: absolute;
      inset: 0;
      padding: 34px 48px 28px;
      background: #000000;
    }

    .grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.55;
      background-image:
        linear-gradient(var(--line-soft) 1px, transparent 1px),
        linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: linear-gradient(180deg, transparent 0%, #000 14%, #000 78%, transparent 100%);
    }

    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 32px;
      min-height: 96px;
    }

    .brand-line {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      font-size: 18px;
      font-weight: 780;
      color: var(--ink);
    }

    .brand-line img {
      width: 30px;
      height: auto;
      display: block;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 840;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 690px;
      font-size: 34px;
      line-height: 1.04;
      font-weight: 860;
      color: var(--ink);
    }

    .sub {
      max-width: 620px;
      margin-top: 13px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.48;
      font-weight: 520;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      max-width: 360px;
      padding-top: 4px;
    }

    .chip {
      height: 30px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0 10px;
      color: var(--soft);
      background: rgba(255, 255, 255, 0.025);
      font-size: 11px;
      font-weight: 760;
      white-space: nowrap;
    }

    .chip.hot {
      color: var(--ink);
      border-color: rgba(255, 100, 40, 0.55);
      background: var(--accent-soft);
    }

    .product {
      position: relative;
      z-index: 1;
      height: 438px;
      margin-top: 4px;
      border: 1px solid var(--line);
      background: #000000;
      overflow: hidden;
    }

    .product::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.035);
      pointer-events: none;
    }

    .panel {
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .micro {
      color: var(--muted);
      font-size: 10px;
      font-weight: 820;
      text-transform: uppercase;
    }

    .accent-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(255, 100, 40, 0.55);
    }

    .architecture {
      display: grid;
      grid-template-columns: 250px 1fr 250px;
      gap: 18px;
      padding: 20px;
    }

    .side-stack {
      display: grid;
      gap: 12px;
    }

    .node {
      min-height: 94px;
      padding: 10px 14px;
    }

    .node .label,
    .main-core .label,
    .cap-card .label,
    .mode .label,
    .token-card .label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .node strong,
    .cap-card strong,
    .mode strong,
    .token-card strong {
      display: block;
      margin: 12px 0 7px;
      color: var(--ink);
      font-size: 20px;
      line-height: 1.05;
      font-weight: 850;
    }

    .node p,
    .cap-card p,
    .mode p,
    .token-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.38;
    }

    .main-core {
      position: relative;
      min-height: 396px;
      padding: 16px 24px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.035), transparent 42%),
        #020202;
    }

    .main-core h2 {
      margin: 10px 0 7px;
      font-size: 30px;
      line-height: 1;
    }

    .main-core p {
      margin: 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.42;
    }

    .core-orbit {
      position: relative;
      height: 136px;
      margin: 8px 0;
      border: 1px solid var(--line-soft);
      background: #000;
      display: grid;
      grid-template-columns: 1fr 128px 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px 14px;
      padding: 10px 30px;
      align-items: stretch;
    }

    .orbit-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 72%;
      height: 1px;
      border: 0;
      background: rgba(255, 255, 255, 0.16);
      transform: translate(-50%, -50%) rotate(-8deg);
      border-radius: 0;
      z-index: 0;
    }

    .orbit-core {
      position: relative;
      grid-column: 2;
      grid-row: 1 / span 2;
      width: 116px;
      height: 116px;
      align-self: center;
      justify-self: center;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 100, 40, 0.52);
      background: #030303;
      font-size: 18px;
      font-weight: 860;
      z-index: 2;
    }

    .orbit-item {
      position: relative;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--line);
      background: #040404;
      color: var(--soft);
      font-size: 10px;
      line-height: 1.18;
      z-index: 2;
    }

    .orbit-item b {
      display: block;
      margin-bottom: 3px;
      color: var(--ink);
      font-size: 12px;
    }

    .orbit-item.a { grid-column: 1; grid-row: 1; }
    .orbit-item.b { grid-column: 3; grid-row: 1; }
    .orbit-item.c { grid-column: 1; grid-row: 2; }
    .orbit-item.d { grid-column: 3; grid-row: 2; }

    .data-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .data-strip div {
      min-height: 62px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      background: #030303;
    }

    .data-strip b {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-size: 14px;
    }

    .data-strip span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
    }

    .token {
      display: grid;
      grid-template-columns: 370px 1fr;
      gap: 18px;
      padding: 20px;
    }

    .token-hero {
      position: relative;
      padding: 32px;
      min-height: 396px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      background: #020202;
    }

    .token-hero .big {
      color: var(--ink);
      font-size: 66px;
      line-height: 0.88;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .token-hero .big span {
      color: var(--accent);
    }

    .token-hero p {
      margin: 18px 0 0;
      max-width: 270px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .token-graph {
      position: relative;
      height: 132px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line-soft);
      overflow: hidden;
    }

    .token-graph i {
      position: absolute;
      left: var(--x);
      bottom: var(--y);
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.28);
    }

    .token-graph .hot {
      background: var(--accent);
    }

    .token-stack {
      display: grid;
      gap: 10px;
    }

    .token-card {
      position: relative;
      display: grid;
      grid-template-columns: 86px 1fr 150px;
      gap: 18px;
      align-items: center;
      padding: 22px;
      min-height: 118px;
      background: #030303;
    }

    .token-card .code {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      color: var(--soft);
      font-size: 22px;
      font-weight: 900;
      background: #000;
    }

    .token-card:first-child .code {
      border-color: rgba(255, 100, 40, 0.55);
      color: var(--accent);
    }

    .token-card .stat {
      border-left: 1px solid var(--line);
      padding-left: 18px;
      color: var(--ink);
      font-size: 22px;
      line-height: 1.05;
      font-weight: 880;
    }

    .token-card .stat small {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
    }

    .capabilities {
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 18px;
      padding: 20px;
    }

    .mode-stack {
      padding: 18px;
      background: #020202;
    }

    .mode-stack-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .mode {
      display: grid;
      grid-template-columns: 112px 1fr 58px;
      gap: 14px;
      align-items: center;
      min-height: 84px;
      border-top: 1px solid var(--line-soft);
    }

    .mode:first-of-type {
      border-top: 0;
    }

    .mode .cmd {
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: #000;
      color: var(--soft);
      font-size: 13px;
      font-weight: 850;
    }

    .mode.primary .cmd,
    .mode.primary .mark {
      border-color: rgba(255, 100, 40, 0.62);
      color: var(--accent);
    }

    .mode strong {
      margin: 0 0 5px;
      font-size: 18px;
    }

    .mode .mark {
      justify-self: end;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
    }

    .cap-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .cap-card {
      min-height: 124px;
      padding: 12px;
      background: #030303;
    }

    .cap-card strong {
      margin-top: 10px;
      font-size: 18px;
    }

    .node strong { margin: 8px 0 6px; font-size: 18px; }
    .main-core .data-strip div { padding: 8px 10px; }
    .main-core .data-strip span { display: block; line-height: 1.35; }

    .cap-card.feature {
      border-color: rgba(255, 100, 40, 0.54);
    }

    .workflow {
      position: relative;
      height: 420px;
      margin-top: 4px;
      border: 1px solid var(--line);
      background: #000000;
      overflow: hidden;
    }

    .workflow-shell {
      position: absolute;
      left: 34px;
      right: 34px;
      top: 20px;
      bottom: 20px;
      display: grid;
      grid-template-columns: 214px 1fr 194px;
      gap: 16px;
    }

    .phase-list,
    .ledger {
      padding: 16px;
      background: #020202;
      border: 1px solid var(--line);
    }

    .phase-title,
    .ledger-title {
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .phase-row {
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 8px;
      align-items: start;
      min-height: 28px;
      color: var(--muted);
      opacity: 0.52;
    }

    .phase-row.done { opacity: 0.86; }
    .phase-row.active { opacity: 1; }

    .phase-num {
      height: 20px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      font-size: 9px;
      font-weight: 850;
      color: var(--muted);
      background: #000;
    }

    .phase-row.active .phase-num {
      color: #000;
      background: var(--accent);
      border-color: var(--accent);
    }

    .phase-row b {
      display: block;
      color: var(--ink);
      font-size: 10px;
      line-height: 1.12;
      margin-bottom: 2px;
    }

    .phase-row span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.2;
    }

    .motion {
      position: relative;
      background: #010101;
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .motion-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 18px 20px 0;
    }

    .motion-head .k {
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .motion-head h2 {
      margin: 8px 0 0;
      font-size: 27px;
      line-height: 1.05;
    }

    .state-pill {
      min-width: 76px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 100, 40, 0.54);
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      background: rgba(255, 100, 40, 0.08);
    }

    .scene-area {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 96px;
      bottom: 24px;
      border: 1px solid var(--line-soft);
      background: #000;
      overflow: hidden;
      transform: translate3d(var(--scene-x), var(--scene-y), 0) scale(var(--scene-scale));
      opacity: var(--scene-opacity);
    }

    .scene-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 18px;
    }

    .work-card {
      min-height: 88px;
      border: 1px solid var(--line);
      background: #040404;
      padding: 14px;
    }

    .work-card b {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 15px;
    }

    .work-card span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.34;
    }

    .command-line {
      margin: 18px;
      padding: 15px 16px;
      border: 1px solid var(--line);
      color: var(--soft);
      background: #020202;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 13px;
    }

    .command-line::before {
      content: ">";
      color: var(--accent);
      margin-right: 10px;
    }

    .signal {
      display: grid;
      grid-template-columns: 1fr 88px 1fr;
      gap: 16px;
      align-items: center;
      height: 100%;
      padding: 22px;
    }

    .signal-stack {
      display: grid;
      gap: 8px;
    }

    .noise-row,
    .clean-row {
      height: 30px;
      border: 1px solid var(--line-soft);
      background: #030303;
      transform: translateX(var(--dx, 0));
      opacity: var(--o, 1);
    }

    .noise-row i,
    .clean-row i {
      display: block;
      height: 100%;
      width: var(--w);
      background: rgba(255, 255, 255, 0.14);
    }

    .clean-row i {
      background: rgba(255, 255, 255, 0.32);
    }

    .filter {
      height: 88px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 100, 40, 0.5);
      color: var(--accent);
      font-size: 13px;
      font-weight: 900;
      background: #030303;
      transform: rotate(var(--filter-angle));
    }

    .tree {
      height: 100%;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .tree-doc {
      border: 1px solid var(--line);
      background: #030303;
      padding: 18px;
    }

    .tree-doc h3 {
      margin: 0 0 14px;
      font-size: 22px;
    }

    .bar {
      display: block;
      width: var(--w);
      height: 7px;
      margin: 9px 0;
      background: rgba(255, 255, 255, 0.18);
    }

    .bar.hot {
      background: var(--accent);
      width: calc(var(--w) * var(--grow));
    }

    .loop {
      position: relative;
      height: 100%;
      padding: 26px 18px;
    }

    .loop-card {
      position: absolute;
      width: 174px;
      min-height: 92px;
      border: 1px solid var(--line);
      background: #040404;
      padding: 14px;
    }

    .loop-card.active {
      border-color: rgba(255, 100, 40, 0.68);
    }

    .loop-card b {
      display: block;
      margin-bottom: 7px;
      font-size: 16px;
    }

    .loop-card span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
    }

    .loop-card.eval { left: 20px; top: 62px; }
    .loop-card.main { left: 224px; top: 36px; }
    .loop-card.code { right: 20px; top: 62px; }

    .loop-line {
      position: absolute;
      height: 1px;
      background: rgba(255, 255, 255, 0.22);
      transform-origin: left center;
    }

    .loop-packet {
      position: absolute;
      left: var(--packet-x);
      top: var(--packet-y);
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 20px rgba(255, 100, 40, 0.62);
      transform: translate(-50%, -50%);
    }

    .pass-panel {
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .pass-mark {
      width: 156px;
      height: 156px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 100, 40, 0.64);
      color: var(--accent);
      font-size: 30px;
      font-weight: 920;
      background: #020202;
    }

    .ledger-card {
      min-height: 84px;
      margin-bottom: 10px;
      padding: 13px;
      border: 1px solid var(--line-soft);
      background: #030303;
    }

    .ledger-card .label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .ledger-card .value {
      margin-top: 9px;
      color: var(--ink);
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
    }

    .ledger-card .value.hot {
      color: var(--accent);
    }

    .tree-ledger {
      display: grid;
      gap: 8px;
    }

    .tree-row {
      min-height: 45px;
      padding: 9px 10px;
      border: 1px solid var(--line-soft);
      background: #030303;
    }

    .tree-row b {
      display: block;
      color: var(--ink);
      font-size: 12px;
      line-height: 1.1;
      margin-bottom: 5px;
    }

    .tree-row span {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
    }

    .tree-row em {
      color: var(--muted);
      font-style: normal;
      font-weight: 900;
      white-space: nowrap;
    }

    .tree-row.pass {
      border-color: rgba(255, 255, 255, 0.20);
    }

    .tree-row.pass em {
      color: var(--ok);
    }

    .tree-row.fix {
      border-color: rgba(255, 100, 40, 0.52);
      background: rgba(255, 100, 40, 0.055);
    }

    .tree-row.fix em,
    .tree-row.active em {
      color: var(--accent);
    }

    .route-map {
      position: relative;
      height: 100%;
      padding: 14px;
    }

    .route-topology {
      position: relative;
      height: calc(100% - 54px);
      margin-top: 10px;
      display: grid;
      grid-template-columns: 134px 118px 1fr;
      gap: 16px;
      align-items: center;
    }

    .route-source,
    .route-gate,
    .route-branch {
      border: 1px solid var(--line);
      background: #030303;
      padding: 13px;
    }

    .route-source b,
    .route-gate b,
    .route-branch b {
      display: block;
      color: var(--ink);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .route-source span,
    .route-gate span,
    .route-branch span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.28;
    }

    .route-gate {
      min-height: 116px;
      display: grid;
      align-content: center;
      border-color: rgba(255, 100, 40, 0.44);
      background: rgba(255, 100, 40, 0.035);
    }

    .route-lanes {
      display: grid;
      gap: 5px;
    }

    .route-branch {
      min-height: 34px;
      padding: 7px 10px;
      transform: translateX(calc((1 - var(--pop)) * 14px));
      opacity: calc(0.32 + var(--pop) * 0.68);
    }

    .route-branch b {
      font-size: 12px;
      margin-bottom: 3px;
    }

    .route-branch span {
      font-size: 9px;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .route-branch.active {
      border-color: rgba(255, 100, 40, 0.62);
      background: rgba(255, 100, 40, 0.052);
    }

    .route-wire {
      position: absolute;
      left: 132px;
      right: 0;
      top: 50%;
      height: 1px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.08), rgba(255, 100, 40, 0.48), rgba(255, 255, 255, 0.12));
      transform: scaleX(var(--route-progress));
      transform-origin: left;
    }

    .route-token {
      position: absolute;
      left: calc(104px + var(--route-progress) * 356px);
      top: calc(50% - 5px);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(255, 100, 40, 0.64);
    }

    .route-command {
      height: 44px;
      border: 1px solid var(--line);
      background: #020202;
      display: flex;
      align-items: center;
      padding: 0 18px;
      color: var(--soft);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 13px;
    }

    .route-command::before {
      content: ">";
      color: var(--accent);
      margin-right: 10px;
    }

    .route-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .route-card {
      min-height: 82px;
      border: 1px solid var(--line);
      background: #030303;
      padding: 13px;
      color: var(--muted);
      transform: translateY(calc((1 - var(--pop)) * 12px));
      opacity: calc(0.36 + var(--pop) * 0.64);
    }

    .route-card.active {
      border-color: rgba(255, 100, 40, 0.62);
    }

    .route-card b,
    .resource-card b,
    .question-card b,
    .payload-card b,
    .diff-card b {
      display: block;
      color: var(--ink);
      font-size: 15px;
      margin-bottom: 7px;
    }

    .route-card span,
    .resource-card span,
    .question-card span,
    .payload-card span,
    .diff-card span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.32;
    }

    .route-decision {
      margin-top: 12px;
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(255, 100, 40, 0.55);
      background: rgba(255, 100, 40, 0.065);
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
    }

    .resource-load {
      height: 100%;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .resource-card {
      border: 1px solid var(--line);
      background: #030303;
      padding: 14px;
    }

    .load-bar {
      height: 7px;
      margin-top: 13px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .load-bar i {
      display: block;
      height: 100%;
      width: calc(var(--fill) * 100%);
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.35), var(--accent));
    }

    .code-scan {
      height: 100%;
      display: grid;
      grid-template-columns: 164px 1fr;
      gap: 10px;
      padding: 12px;
    }

    .file-tree,
    .code-pane {
      border: 1px solid var(--line);
      background: #030303;
      padding: 10px;
      overflow: hidden;
    }

    .file-node {
      height: 20px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line-soft);
      color: var(--muted);
      font-size: 9px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .file-node.active {
      color: var(--accent);
    }

    .code-line {
      display: block;
      height: 7px;
      width: var(--w);
      margin: 8px 0;
      background: rgba(255, 255, 255, 0.14);
      transform: scaleX(var(--scan));
      transform-origin: left;
    }

    .code-line.hot {
      background: rgba(255, 100, 40, 0.62);
    }

    .scan-note {
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 100, 40, 0.42);
      color: var(--soft);
      font-size: 10px;
      line-height: 1.25;
      background: rgba(255, 100, 40, 0.045);
    }

    .confirm-action {
      height: 100%;
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 14px;
      align-items: stretch;
    }

    .confirm-summary {
      border: 1px solid var(--line);
      background: #030303;
      padding: 16px;
      display: grid;
      gap: 10px;
      align-content: center;
    }

    .confirm-summary h3 {
      margin: 0;
      color: var(--ink);
      font-size: 22px;
      line-height: 1.08;
    }

    .confirm-item {
      border: 1px solid var(--line-soft);
      background: #000;
      padding: 8px 10px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.25;
    }

    .confirm-item b {
      display: block;
      color: var(--soft);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .confirm-button {
      border: 1px solid rgba(255, 100, 40, 0.58);
      background: rgba(255, 100, 40, 0.055);
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--accent);
      font-weight: 920;
      transform: scale(calc(0.98 + var(--click) * 0.02));
      box-shadow: 0 0 calc(var(--click) * 24px) rgba(255, 100, 40, 0.25);
    }

    .confirm-button span {
      display: block;
      margin-top: 8px;
      color: var(--soft);
      font-size: 11px;
      line-height: 1.25;
      font-weight: 700;
    }

    .discovery-search {
      height: 100%;
      padding: 11px;
      display: grid;
      grid-template-columns: 1.04fr 0.96fr;
      gap: 12px;
    }

    .dialogue-stream,
    .live-search {
      min-width: 0;
      border: 1px solid var(--line);
      background: #030303;
      padding: 10px;
      overflow: hidden;
    }

    .dialogue-stream {
      display: grid;
      gap: 6px;
      align-content: start;
    }

    .turn {
      border: 1px solid var(--line-soft);
      background: #000;
      padding: 7px 9px;
      transform: translateY(calc((1 - var(--reveal)) * 10px));
      opacity: calc(0.14 + var(--reveal) * 0.86);
    }

    .turn b {
      display: block;
      color: var(--ink);
      font-size: 10px;
      margin-bottom: 4px;
    }

    .turn span {
      color: var(--muted);
      font-size: 9px;
      line-height: 1.2;
    }

    .turn.answer {
      margin-left: 28px;
    }

    .turn.challenge {
      border-color: rgba(255, 100, 40, 0.5);
      background: rgba(255, 100, 40, 0.045);
    }

    .search-query {
      height: 30px;
      display: flex;
      align-items: center;
      padding: 0 11px;
      border: 1px solid var(--line-soft);
      color: var(--soft);
      background: #000;
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-query::before {
      content: "$";
      color: var(--accent);
      margin-right: 8px;
    }

    .search-results {
      display: grid;
      gap: 5px;
      margin-top: 8px;
    }

    .result-row {
      display: grid;
      grid-template-columns: 1fr 42px;
      gap: 8px;
      align-items: center;
      min-height: 23px;
      padding: 5px 7px;
      border: 1px solid var(--line-soft);
      color: var(--muted);
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      opacity: calc(0.2 + var(--hit) * 0.8);
    }

    .result-row.hot {
      color: var(--soft);
      border-color: rgba(255, 100, 40, 0.42);
    }

    .result-row em {
      color: var(--accent);
      font-style: normal;
      font-weight: 900;
      text-align: right;
    }

    .index-note {
      margin-top: 8px;
      padding: 7px 8px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      color: var(--soft);
      font-size: 10px;
      line-height: 1.32;
      background: #000;
      opacity: var(--index-ready);
    }

    .socratic {
      height: 100%;
      padding: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .question-card {
      border: 1px solid var(--line);
      background: #030303;
      padding: 14px;
      transform: translateY(calc((1 - var(--reveal)) * 12px));
      opacity: calc(0.18 + var(--reveal) * 0.82);
    }

    .question-card.challenge {
      border-color: rgba(255, 100, 40, 0.55);
    }

    .confirm-tree {
      height: 100%;
      padding: 11px;
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 11px;
    }

    .confirm-card {
      border: 1px solid rgba(255, 100, 40, 0.58);
      background: rgba(255, 100, 40, 0.055);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 18px;
    }

    .confirm-card b {
      color: var(--accent);
      display: block;
      font-size: 20px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .confirm-card span {
      display: block;
      color: var(--soft);
      font-size: 12px;
      line-height: 1.35;
    }

    .tree-build {
      border: 1px solid var(--line);
      background: #030303;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .doc-tree-build {
      position: relative;
      border: 1px solid var(--line);
      background: #030303;
      padding: 10px;
      overflow: hidden;
    }

    .tree-root,
    .tree-child,
    .tree-ac {
      border: 1px solid var(--line-soft);
      background: #000;
      padding: 8px 10px;
      opacity: calc(0.12 + var(--tree-pop) * 0.88);
      transform: translateY(calc((1 - var(--tree-pop)) * 12px));
    }

    .tree-root {
      width: 42%;
      margin: 0 auto 9px;
      border-color: rgba(255, 100, 40, 0.48);
      text-align: center;
    }

    .tree-root b,
    .tree-child b,
    .tree-ac b {
      display: block;
      color: var(--ink);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .tree-root span,
    .tree-child span,
    .tree-ac span {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.25;
    }

    .tree-branches {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .tree-branches::before {
      content: "";
      position: absolute;
      left: 25%;
      right: 25%;
      top: -9px;
      height: 1px;
      background: rgba(255, 255, 255, 0.24);
      transform: scaleX(var(--tree-pop));
    }

    .tree-ac-list {
      display: grid;
      gap: 5px;
      margin-top: 7px;
    }

    .doc-tree-build .tree-ac-list {
      grid-template-columns: repeat(2, 1fr);
    }

    .doc-tree-build .tree-root { width: 100%; }
    .doc-tree-build span { display: block; line-height: 1.3; }
    .doc-tree-build .tree-child { padding: 7px; min-width: 0; }
    .doc-tree-build .tree-ac { padding: 6px; }

    .tree-ac {
      min-height: 28px;
      padding: 6px 8px;
    }

    .tree-doclet {
      border: 1px solid var(--line-soft);
      background: #000;
      padding: 13px;
      transform: translateY(calc((1 - var(--tree-pop)) * 14px));
      opacity: calc(0.16 + var(--tree-pop) * 0.84);
    }

    .tree-doclet b {
      display: block;
      color: var(--ink);
      font-size: 17px;
      margin-bottom: 10px;
    }

    .denoise-lab {
      height: 100%;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 110px 1fr;
      gap: 14px;
      align-items: center;
    }

    .context-cloud,
    .distilled-stack {
      min-height: 226px;
      border: 1px solid var(--line);
      background: #030303;
      padding: 14px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px;
      overflow: hidden;
    }

    .context-chip {
      height: 22px;
      width: var(--w);
      border: 1px solid var(--line-soft);
      background: rgba(255, 255, 255, 0.055);
      opacity: var(--drop);
      transform: scale(var(--scale)) translateY(var(--dy));
    }

    .distilled-fact {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      background: #000;
      padding: 8px 10px;
      opacity: var(--reveal);
      transform: translateX(calc((1 - var(--reveal)) * 16px));
    }

    .distilled-fact b {
      display: block;
      color: var(--ink);
      font-size: 13px;
      margin-bottom: 5px;
    }

    .distilled-fact span {
      color: var(--muted);
      font-size: 9px;
      line-height: 1.2;
    }

    .compressor {
      height: 110px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 100, 40, 0.56);
      color: var(--accent);
      background: rgba(255, 100, 40, 0.055);
      font-weight: 920;
      transform: scale(calc(0.92 + var(--pulse) * 0.08));
    }

    .noise-chip {
      min-height: 22px;
      width: var(--w);
      border: 1px solid var(--line-soft);
      background: rgba(255, 255, 255, 0.052);
      color: rgba(255, 255, 255, 0.52);
      padding: 5px 7px;
      font-size: 9px;
      line-height: 1.05;
      opacity: var(--drop);
      transform: scale(var(--scale)) translateY(var(--dy));
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .noise-chip.keep {
      color: var(--soft);
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.075);
    }

    .noise-chip.drop {
      text-decoration: line-through;
      filter: blur(calc((1 - var(--drop)) * 2px));
    }

    .signal-funnel {
      height: 130px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 100, 40, 0.48);
      color: var(--accent);
      background: rgba(255, 100, 40, 0.052);
      font-weight: 920;
      font-size: 12px;
      text-align: center;
      line-height: 1.2;
      transform: scale(calc(0.94 + var(--pulse) * 0.06));
    }

    .prompt-dispatch,
    .coder-build {
      height: 100%;
      padding: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .payload-card,
    .diff-card {
      border: 1px solid var(--line);
      background: #030303;
      padding: 14px;
    }

    .dim-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .dim-list i,
    .ac-list i {
      display: block;
      border: 1px solid var(--line-soft);
      color: var(--muted);
      background: #000;
      padding: 6px 8px;
      font-size: 10px;
      font-style: normal;
    }

    .dim-list i.hot,
    .ac-list i.hot {
      border-color: rgba(255, 100, 40, 0.48);
      color: var(--accent);
    }

    .diff-line {
      display: block;
      height: 8px;
      width: var(--w);
      margin: 9px 0;
      background: rgba(255, 255, 255, 0.13);
    }

    .diff-line.add {
      background: rgba(255, 100, 40, 0.55);
      transform: scaleX(calc(0.18 + var(--write) * 0.82));
      transform-origin: left;
    }

    .razor {
      margin-top: 12px;
      padding: 11px;
      border: 1px solid rgba(255, 100, 40, 0.45);
      color: var(--soft);
      background: rgba(255, 100, 40, 0.045);
      font-size: 11px;
      line-height: 1.35;
    }

    .eval-board {
      height: 100%;
      padding: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    .iteration-board {
      height: 100%;
      padding: 16px;
      display: grid;
      grid-template-columns: 0.92fr 1.08fr 0.92fr;
      gap: 12px;
    }

    .iteration-flow {
      height: 100%;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      align-items: stretch;
    }

    .iter-step {
      position: relative;
      border: 1px solid var(--line);
      background: #030303;
      padding: 10px;
      overflow: hidden;
      opacity: calc(0.32 + var(--on) * 0.68);
      transform: translateY(calc((1 - var(--on)) * 8px));
    }

    .iter-step.active {
      border-color: rgba(255, 100, 40, 0.52);
      background: rgba(255, 100, 40, 0.035);
    }

    .iter-step b {
      display: block;
      color: var(--ink);
      font-size: 13px;
      margin-bottom: 7px;
    }

    .iter-step span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.2;
      min-height: 32px;
    }

    .iter-step::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 8px;
      height: 1px;
      background: rgba(255, 100, 40, 0.52);
      transform: scaleX(var(--flow));
      transform-origin: left;
    }

    .iter-mini-list {
      display: grid;
      gap: 5px;
      margin-top: 9px;
    }

    .iter-mini-list i {
      padding: 5px 6px;
      border: 1px solid var(--line-soft);
      color: var(--muted);
      background: #000;
      font-size: 9px;
      font-style: normal;
      white-space: nowrap;
    }

    .iter-mini-list i.hot {
      color: var(--accent);
      border-color: rgba(255, 100, 40, 0.42);
    }

    .iter-mini-list i.pass {
      color: var(--ok);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .iter-card {
      border: 1px solid var(--line);
      background: #030303;
      padding: 13px;
      overflow: hidden;
    }

    .iter-card.active {
      border-color: rgba(255, 100, 40, 0.48);
      background: rgba(255, 100, 40, 0.034);
    }

    .iter-card b {
      display: block;
      color: var(--ink);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .iter-card span {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.28;
    }

    .skill-chip {
      display: inline-flex;
      margin: 8px 0 2px;
      padding: 5px 7px;
      border: 1px solid rgba(255, 100, 40, 0.42);
      color: var(--accent);
      background: rgba(255, 100, 40, 0.052);
      font-size: 10px;
      font-weight: 900;
      font-style: normal;
    }

    .iter-arrow {
      height: 1px;
      margin: 13px 0;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.1), rgba(255, 100, 40, 0.58));
      transform: scaleX(var(--flow));
      transform-origin: left;
    }

    .iter-status {
      display: grid;
      gap: 7px;
      margin-top: 10px;
    }

    .iter-status i {
      padding: 6px 8px;
      border: 1px solid var(--line-soft);
      color: var(--muted);
      background: #000;
      font-size: 10px;
      font-style: normal;
    }

    .iter-status i.hot {
      color: var(--accent);
      border-color: rgba(255, 100, 40, 0.42);
    }

    .iter-status i.pass {
      color: var(--ok);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .eval-col {
      border: 1px solid var(--line);
      background: #030303;
      padding: 14px;
    }

    .eval-col.active {
      border-color: rgba(255, 100, 40, 0.58);
    }

    .eval-col b {
      display: block;
      color: var(--ink);
      font-size: 16px;
      margin-bottom: 10px;
    }

    .ac-list {
      display: grid;
      gap: 8px;
    }

    .final-board {
      height: 100%;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .final-board.tree-close {
      grid-template-columns: 1.12fr 0.88fr;
    }

    .final-tree .tree-ac-list {
      margin-top: 12px;
    }

    .final-tree .tree-ac {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .final-tree .tree-ac.pass b {
      color: var(--ok);
    }

    .final-pass-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-top: 6px;
    }

    .final-pass {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #000;
      padding: 5px 6px;
      min-height: 29px;
    }

    .final-pass b {
      display: block;
      color: var(--ok);
      font-size: 9px;
      margin-bottom: 2px;
    }

    .final-pass span {
      color: var(--muted);
      font-size: 8px;
      line-height: 1.12;
      white-space: nowrap;
    }

    .final-tree {
      border: 1px solid rgba(255, 100, 40, 0.5);
      background: rgba(255, 100, 40, 0.035);
      padding: 10px;
    }

    .notes-demo { position: relative; margin-top: 18px; display: grid; grid-template-columns: 1fr 1.12fr; gap: 16px; }

    .notes-demo h2 { font-size: 19px; margin: 0 0 16px; color: var(--accent); }
    .notes-demo pre { font: 16px/1.5 Consolas, monospace; margin: 0; color: var(--soft); }

          ]
        },
        token: {

          layers: [
            ["L1", "One file per fact", "Scope, acceptance, and verification live together; xdo uses no Payload.", "one read"],
            ["L2", "Link instead of inline", "Related notes link by URI plus a one-line summary, never pasted prose.", "thinner docs"],

        ],
        caps: [

        ],
        steps: [
          ["Routing", "Explicit xflow enters without silent switching"],
          ["Repo discovery", "module 08 plus same-target check"],
          ["File index", "Structure, deps, and constraints mapped"],
          ["socratesX", "Batched questions plus challenge"],
          ["Ready Summary", "Confirm scope before Task planning"],
          ["task notes", "requirement / task / decision written down"],

    };

    const C = i18n[lang] || i18n.zh;

    function sceneLabel() {
      if (scene === "notes") return "harness-note/2";
      if (scene === "architecture") return C.labelArch;
      if (scene === "token") return C.labelToken;
      if (scene === "capabilities") return C.labelCap;
      return C.labelFlow;
    }

    function header(title, sub) {
      return `
        <div class="topbar">
          <div>
            <div class="brand-line"><img src="WorkFlowX-Logo.png" alt="" />WorkflowX</div>
            <div class="eyebrow">${sceneLabel()}</div>
            <h1>${title}</h1>
            <div class="sub">${sub}</div>
          </div>
          <div class="chips">${C.chips.map((chip, i) => `<span class="chip ${i === 2 ? "hot" : ""}">${chip}</span>`).join("")}</div>
        </div>`;
    }

    function layout(body, title, sub) {
      root.innerHTML = `
        <section class="frame">
          <div class="grid"></div>
          ${header(title, sub)}
          ${body}
        </section>`;
      window.__ready = true;
    }

    function architecture() {
      const n = C.nodes;
      layout(`
        <div class="product architecture">
          <div class="side-stack">
            ${node(n.command, true)}
            ${node(n.status)}
            ${node(n.prompt)}
          </div>
          <div class="main-core panel">
            <div>
              <div class="label"><span class="accent-dot"></span>${C.core.sub}</div>
              <h2>${C.core.title}</h2>
              <p>${lang === "zh" ? "路由、规划、文档写入和任务派发集中在一个编排核心里。" : "Routing, planning, document writes, and dispatch converge into one orchestration core."}</p>
            </div>
            <div class="core-orbit">
              <div class="orbit-ring"></div>
              <div class="orbit-core">Main<br/>Agent</div>
              ${C.core.orbit.map((item, i) => `<div class="orbit-item ${["a","b","c","d"][i]}"><b>${item[0]}</b>${item[1]}</div>`).join("")}
            </div>
            <div class="data-strip">${C.core.data.map((d) => `<div><b>${d[0]}</b><span>${d[1]}</span></div>`).join("")}</div>
          </div>
          <div class="side-stack">
            ${node(n.coder, true)}
            ${node(n.evaluator, true)}
            ${node(["Payload Bus", "Change Summary / Evaluation Result", lang === "zh" ? "代理不直接改事实源，只交结构化结果。" : "Agents hand off structured results instead of writing the fact source."])}
          </div>
        </div>`,
        C.archTitle,
        C.archSub
      );
    }

    function node(item, hot = false) {
      return `<div class="node panel">
        <div class="label">${hot ? '<span class="accent-dot"></span>' : ""}${item[0]}</div>
        <strong>${item[1]}</strong>
        <p>${item[2]}</p>
      </div>`;
    }

    function token() {
      const dots = Array.from({ length: 28 }, (_, i) => {
        const x = 5 + i * 3.35;
        const y = 22 + Math.sin(i * 0.58) * 22 + i * 0.85;
        return `<i class="${i > 19 ? "hot" : ""}" style="--x:${x.toFixed(1)}%;--y:${Math.max(8, Math.min(84, y)).toFixed(1)}%"></i>`;
      }).join("");
      layout(`
        <div class="product token">
          <div class="token-hero panel">
            <div>
              <div class="micro">${lang === "zh" ? "Context Budget Engine" : "Context Budget Engine"}</div>
              <div class="big">${C.token.big.replace("-", "<span>-</span>")}</div>
              <p>${C.token.body}</p>
            </div>
            <div class="token-graph">${dots}</div>
          </div>
          <div class="token-stack">
            ${C.token.layers.map((layer, i) => `
              <div class="token-card panel">
                <div class="code">${layer[0]}</div>
                <div>
                  <div class="label">${i === 0 ? '<span class="accent-dot"></span>' : ""}${layer[3]}</div>
                  <strong>${layer[1]}</strong>
                  <p>${layer[2]}</p>
                </div>
                <div class="stat">${i === 0 ? C.token.big : i === 1 ? (lang === "zh" ? "更薄" : "Thinner") : (lang === "zh" ? "跨会话" : "Reusable")}<small>${layer[3]}</small></div>
              </div>`).join("")}
          </div>
        </div>`,
        C.tokenTitle,
        C.tokenSub
      );
    }

    function capabilities() {
      layout(`
        <div class="product capabilities">
          <div class="mode-stack panel">
            <div class="mode-stack-title"><span>${lang === "zh" ? "Blast Radius" : "Blast Radius"}</span><span>-box / --parallel</span></div>

              <div class="mode ${i === 2 ? "primary" : ""}">
                <div class="cmd">${mode[0]}</div>
                <div><strong>${mode[1]}</strong><p>${mode[2]}</p></div>
                <div class="mark">${mode[3]}</div>
              </div>`).join("")}
          </div>
          <div class="cap-grid">
            ${C.caps.map((cap, i) => `
              <div class="cap-card panel ${i < 2 ? "feature" : ""}">
                <div class="label">${i < 2 ? '<span class="accent-dot"></span>' : ""}${String(i + 1).padStart(2, "0")}</div>

                <p>${cap[1]}</p>
              </div>`).join("")}
          </div>
        </div>`,
        C.capTitle,
        C.capSub
      );
    }

    function workflow(t) {
      const clamp = (v) => Math.max(0, Math.min(1, v));
      const expo = (v) => v >= 1 ? 1 : 1 - Math.pow(2, -8 * v);
      const weights = [1.0, 1.05, 1.25, 0.95, 1.15, 1.35, 1.45, 1.35, 1.25, 1.6];
      const total = weights.reduce((sum, v) => sum + v, 0);
      const raw = clamp(t || 0) * total;
      let cursor = raw;
      let idx = 0;
      while (idx < weights.length - 1 && cursor >= weights[idx]) cursor -= weights[idx++];
      const local = clamp(cursor / weights[idx]);
      const enter = expo(clamp(local * 1.6));
      const card = C.steps[idx];
      const status = idx < 5 ? "DISCOVER" : idx === 5 ? "SPEC" : idx === 6 ? "BUILD" : idx === 7 ? "VERIFY" : idx === 8 ? "FIX" : local < 0.5 ? "HANDOFF" : "CLOSED";
      const view = activeView(idx, local, enter, expo, clamp);
      const style = [
        `--scene-x:${((1 - enter) * 14).toFixed(1)}px`,
        `--scene-y:${((1 - enter) * 7).toFixed(1)}px`,
        `--scene-scale:${(0.986 + enter * 0.014).toFixed(3)}`,
        `--scene-opacity:${(0.48 + enter * 0.52).toFixed(3)}`
      ].join(";");

      root.innerHTML = `
        <section class="frame">
          <div class="grid"></div>
          ${header(C.workflowTitle, C.workflowSub)}
          <div class="workflow" style="${style}">
            <div class="workflow-shell">
              <aside class="phase-list">
                <div class="phase-title">${lang === "zh" ? "阶段索引" : "Phase Index"}</div>
                ${C.steps.map((step, i) => `
                  <div class="phase-row ${i < idx ? "done" : i === idx ? "active" : ""}">
                    <div class="phase-num">${String(i + 1).padStart(2, "0")}</div>
                    <div><b>${step[0]}</b><span>${step[1]}</span></div>
                  </div>`).join("")}
              </aside>
              <main class="motion">
                <div class="motion-head">
                  <div><div class="k">${lang === "zh" ? "当前演示" : "Current Demo"} / ${String(idx + 1).padStart(2, "0")}</div><h2>${card[0]}</h2></div>
                  <div class="state-pill">${status}</div>
                </div>
                <div class="scene-area">${view}</div>
              </main>
              <aside class="ledger">
                <div class="ledger-title">Task Notes Ledger</div>
                ${ledgerView(idx, local)}
              </aside>
            </div>
          </div>
          <div class="watermark">Created by Huashu-Design</div>
        </section>`;
      window.__ready = true;
    }

    function ledgerView(idx, local) {
      const statusFor = (name, start, passAt, failAt = -1) => {
        let cls = "";
        let status = "WAIT";
        if (idx >= start) { cls = "active"; status = "TRACK"; }
        if (idx >= failAt && failAt >= 0 && idx < passAt) { cls = "fix"; status = "FIX"; }
        if (idx >= passAt) { cls = "pass"; status = "PASS"; }
        return [cls, status];
      };
      const rows = [
        ["Scope", lang === "zh" ? "范围与非目标" : "Scope and non-goals", ...statusFor("scope", 3, 4)],
        ["AC-01", lang === "zh" ? "路由与状态恢复" : "Routing and state recovery", ...statusFor("ac1", 5, 7)],
        ["AC-02", lang === "zh" ? "回滚记录操作者" : "Rollback records the operator", ...statusFor("ac2", 5, 9, 7)],
        ["AC-03", lang === "zh" ? "支付回调幂等" : "Idempotent payment callbacks", ...statusFor("ac3", 5, 7)],
        ["Note", lang === "zh" ? "原子落盘与反向注释" : "Atomic landing plus reverse comment", ...statusFor("note", 8, local < 0.5 ? 10 : 9)]
      ];
      return `<div class="tree-ledger">${rows.map(([name, body, cls, status]) => `
        <div class="tree-row ${cls}">
          <b>${name}</b>
          <span>${body}<em>${status}</em></span>
        </div>`).join("")}</div>`;
    }

    function activeView(idx, local, enter, expo, clamp) {
      const bars = [88, 62, 74, 48].map((w, i) => `<i class="bar ${i === 0 ? "hot" : ""}" style="--w:${w}%;--grow:${enter.toFixed(2)}"></i>`).join("");
      if (idx === 0) {
        const routeProgress = expo(clamp(local * 1.28)).toFixed(3);
        const pop = (n) => expo(clamp(local * 2.4 - n * 0.16)).toFixed(3);
        return `<div class="route-map">
          <div class="route-command">xflow ${lang === "zh" ? "实现订单中心" : "build the order center"}</div>
          <div class="route-topology" style="--route-progress:${routeProgress}">
            <div class="route-wire"></div><div class="route-token"></div>
            <div class="route-source"><b>${lang === "zh" ? "入口命令" : "Entry"}</b><span>xflow / explicit command wins</span></div>
            <div class="route-gate"><b>orchestrateX</b><span>${lang === "zh" ? "读完整输入与会话上下文，不悄悄切换" : "Reads full input and conversation context"}</span></div>
            <div class="route-lanes">
              <div class="route-branch active" style="--pop:${pop(0)}"><b>xflow</b><span>${lang === "zh" ? "显式命令：立即进入" : "Explicit command: enter now"}</span></div>
              <div class="route-branch" style="--pop:${pop(1)}"><b>xdel</b><span>${lang === "zh" ? "本地清晰工作" : "Clear local work"}</span></div>
              <div class="route-branch" style="--pop:${pop(2)}"><b>xdo</b><span>${lang === "zh" ? "直接执行" : "Direct work"}</span></div>
              <div class="route-branch" style="--pop:${pop(3)}"><b>${lang === "zh" ? "模糊三选一" : "Ambiguous"}</b><span>${lang === "zh" ? "不代选，摆出选择" : "Present all three"}</span></div>
            </div>
          </div>
        </div>`;
      }
      if (idx === 1) {
        const fill = (offset) => expo(clamp(local * 1.5 - offset)).toFixed(3);
        const items = [
          ["module 08", lang === "zh" ? "搜结构、依赖、约束与约定" : "Search structure, deps, constraints"],
          ["Same-target", lang === "zh" ? "只查同文件同 note 冲突" : "Check same files and notes only"],
          ["-box demo", lang === "zh" ? "沙箱分支隔离执行" : "Isolated sandbox branch"],
          ["Worktree", lang === "zh" ? "支持时隔离，否则记录" : "Isolate when supported"]
        ];
        return `<div class="resource-load">${items.map((item, i) => `
          <div class="resource-card"><b>${item[0]}</b><span>${item[1]}</span><div class="load-bar"><i style="--fill:${fill(i * 0.16)}"></i></div></div>`).join("")}</div>`;
      }
      if (idx === 2) {
        const scan = expo(clamp(local * 1.35)).toFixed(3);
        const files = ["src/routes/order.ts", "src/services/auth.ts", "src/payments/callback.ts", "tests/order.spec.ts", ".agents/notes/orders/tasks/restore.md"];
        const lines = [92, 72, 64, 88, 56, 76, 68].map((w, i) => `<i class="code-line ${i === 2 || i === 5 ? "hot" : ""}" style="--w:${w}%;--scan:${scan}"></i>`).join("");
        return `<div class="code-scan">
          <div class="file-tree">${files.map((file, i) => `<div class="file-node ${i < local * files.length ? "active" : ""}">${file}</div>`).join("")}</div>
          <div class="code-pane">${lines}<div class="scan-note">${lang === "zh" ? "工程缩影先建立文件索引：路由、auth、支付回调、测试入口。" : "Project snapshot builds the file index: routes, auth, callbacks, and tests."}</div></div>
        </div>`;
      }
      if (idx === 3) {
        const reveal = (n) => expo(clamp(local * 1.9 - n * 0.18)).toFixed(3);
        const hit = (n) => expo(clamp(local * 1.7 - n * 0.16)).toFixed(3);
        const turns = lang === "zh"
          ? [["Main Agent / 问", "订单状态是否允许人工回滚？"], ["User / 答", "允许，但必须记录操作者和原因。"], ["Main Agent / 质疑", "你要求并行验收，但支付回调写共享状态，这里必须加锁或幂等。"]]
          : [["Main Agent / Q", "Can order state be manually rolled back?"], ["User / A", "Yes, but operator and reason must be recorded."], ["Main Agent / Challenge", "You requested parallel verification, but payment callbacks write shared state; idempotency or locking is required."]];
        const results = [
          ["src/routes/order.ts", "route"],
          ["src/services/auth.ts", "auth"],
          ["src/payments/callback.ts", "risk"],
          ["tests/order.spec.ts", "test"],
          [".agents/notes/orders/tasks/restore.md", "notes"]
        ];
        return `<div class="discovery-search">
          <div class="dialogue-stream">${turns.map((turn, i) => `<div class="turn ${i === 1 ? "answer" : ""} ${i === 2 ? "challenge" : ""}" style="--reveal:${reveal(i)}"><b>${turn[0]}</b><span>${turn[1]}</span></div>`).join("")}</div>
          <div class="live-search">
            <div class="search-query">rg -n "rollback|payment|auth|parallel" src tests .agents/notes</div>
            <div class="search-results">${results.map((r, i) => `<div class="result-row ${i === 2 ? "hot" : ""}" style="--hit:${hit(i)}"><span>${r[0]}</span><em>${r[1]}</em></div>`).join("")}</div>
            <div class="index-note" style="--index-ready:${reveal(2)}">${lang === "zh" ? "搜索结果收束成 AC：回滚、权限、幂等与恢复路径。" : "Search results become ACs: rollback, permission, idempotency, and recovery."}</div>
          </div>
        </div>`;
      }
      if (idx === 4) {
        const click = expo(clamp(local * 1.4 - 0.18)).toFixed(3);
        const items = lang === "zh"
          ? [["范围", "订单中心覆盖创建、支付回调与状态流转。"], ["风险", "并行验收必须处理共享状态与幂等。"], ["AC", "回滚、权限、恢复路径、测试入口已明确。"]]
          : [["Scope", "Order center covers creation, callbacks, and state flow."], ["Risk", "Parallel verification must handle shared state and idempotency."], ["AC", "Rollback, permission, recovery path, and test entry are explicit."]];
        return `<div class="confirm-action" style="--click:${click}">
          <div class="confirm-summary"><h3>${lang === "zh" ? "先确认，再建 note" : "Confirm before notes"}</h3>${items.map((item) => `<div class="confirm-item"><b>${item[0]}</b>${item[1]}</div>`).join("")}</div>
          <div class="confirm-button">${lang === "zh" ? "点击确认" : "Confirm"}<span>${lang === "zh" ? "Ready Summary 通过后才允许建 task notes" : "Task notes start only after Ready Summary"}</span></div>
        </div>`;
      }
      if (idx === 5) {
        const treePop = expo(clamp(local * 1.55)).toFixed(3);
        const gateText = lang === "zh" ? "确认完成，开始写 requirement / task / decision。" : "Confirmed; write requirement / task / decision notes.";
        return `<div class="confirm-tree">
          <div class="confirm-card"><div><b>${lang === "zh" ? "已确认" : "Confirmed"}</b><span>${gateText}</span></div></div>
          <div class="doc-tree-build" style="--tree-pop:${treePop}">
            <div class="tree-root"><b>orders/module.md</b><span>${lang === "zh" ? "模块职责与总体设计；下方 Task 引用固定 AC" : "Responsibility and design; Tasks below reference fixed AC"}</span></div>
            <div class="tree-branches">
              <div class="tree-child"><b>tasks/restore.md</b><span>${lang === "zh" ? "订单状态与恢复" : "Order state and recovery"}</span><div class="tree-ac-list"><div class="tree-ac"><b>AC-01</b><span>${lang === "zh" ? "路由恢复可验收" : "Route recovery is verifiable"}</span></div><div class="tree-ac"><b>AC-02</b><span>${lang === "zh" ? "回滚记录操作者" : "Rollback records operator"}</span></div></div></div>
              <div class="tree-child"><b>tasks/idempotency.md</b><span>${lang === "zh" ? "支付回调与幂等" : "Payment callback and idempotency"}</span><div class="tree-ac-list"><div class="tree-ac"><b>AC-03</b><span>${lang === "zh" ? "幂等和测试覆盖" : "Idempotency and test coverage"}</span></div><div class="tree-ac"><b>decision</b><span>${lang === "zh" ? "取舍与重访信号" : "Trade-off and revisit"}</span></div></div></div>
            </div>
          </div>
        </div>`;
      }
      if (idx === 6) {
        const write = expo(clamp(local * 1.4)).toFixed(3);
        const dims = ["Task URI", "AC refs", "Scope", "Handoff", "Checks"];
        const diffs = [92, 64, 78, 54].map((w) => `<i class="diff-line add" style="--w:${w}%;--write:${write}"></i>`).join("");
        return `<div class="prompt-dispatch">
          <div class="payload-card"><b>coderX</b><span>${lang === "zh" ? "Main 更新 Handoff 后派发；coderX 只读 Task，自审后返回。" : "Main updates Handoff first; coderX reads the Task and self-reviews."}</span><div class="dim-list">${dims.map((d, i) => `<i class="${i < local * dims.length ? "hot" : ""}">${d}</i>`).join("")}</div></div>
          <div class="diff-card"><b>${lang === "zh" ? "实现 + 自审" : "Build + self-review"}</b><span>engineeringX + specX</span>${diffs}<div class="razor">${lang === "zh" ? "最小改动，只做被要求的；Note 草稿随实现返回。" : "Smallest change only; Note draft returns with code."}</div></div>
        </div>`;
      }
      if (idx === 7) {
        const cols = lang === "zh"
          ? [["AC-01", ["下单路由 200", "恢复状态正确"], "PASS"], ["AC-02", ["回滚缺少操作者", "审计断言失败"], "FIX"], ["AC-03", ["回调幂等通过", "测试已运行"], "PASS"]]
          : [["AC-01", ["route 200", "state restored"], "PASS"], ["AC-02", ["rollback operator missing", "audit assertion failed"], "FIX"], ["AC-03", ["idempotency passed", "tests run"], "PASS"]];
        return `<div class="eval-board">${cols.map((col, i) => `
          <div class="eval-col ${i === 1 ? "active" : ""}"><b>${col[0]} · ${col[2]}</b><div class="ac-list">${col[1].map((c) => `<i class="${col[2] === "PASS" ? "" : "hot"}">${c}</i>`).join("")}</div></div>`).join("")}</div>`;
      }
      if (idx === 8) {
        return tieredFix(local, expo, clamp);
      }
      if (idx === 9 && local < 0.5) {
        const treePop = expo(1);
        return `<div class="confirm-tree">
          <div class="confirm-card"><div><b>${lang === "zh" ? "回写" : "Writeback"}</b><span>${lang === "zh" ? "主智能体把复验结果写回 task notes，而不是只显示 PASS。" : "The Main Agent writes verification results back to task notes, not just a PASS label."}</span></div></div>
          <div class="doc-tree-build" style="--tree-pop:${treePop}">
            <div class="tree-root"><b>orders/module.md</b><span>${lang === "zh" ? "模块维护设计；下方 Task 维护证据与交接" : "Module owns design; Tasks below own evidence and handoff"}</span></div>
            <div class="tree-branches">
              <div class="tree-child"><b>tasks/restore.md</b><span>${lang === "zh" ? "订单状态与恢复" : "Order state and recovery"}</span><div class="tree-ac-list"><div class="tree-ac pass"><b>AC-01 PASS</b><span>${lang === "zh" ? "路由恢复已验收" : "Route recovery verified"}</span></div><div class="tree-ac pass"><b>AC-02 PASS</b><span>${lang === "zh" ? "回滚审计已覆盖" : "Rollback audit covered"}</span></div></div></div>
              <div class="tree-child"><b>tasks/idempotency.md</b><span>${lang === "zh" ? "支付回调与幂等" : "Payment callback and idempotency"}</span><div class="tree-ac-list"><div class="tree-ac pass"><b>AC-03 PASS</b><span>${lang === "zh" ? "幂等测试已通过" : "Idempotency tests passed"}</span></div><div class="tree-ac"><b>Note</b><span>${lang === "zh" ? "等待原子落盘" : "Atomic landing pending"}</span></div></div></div>
            </div>
          </div>
        </div>`;
      }
      return `<div class="final-board tree-close">
        <div class="final-tree"><h3>task notes</h3><div class="tree-root"><b>orders/module.md</b><span>${lang === "zh" ? "模块状态独立于 Task 结果" : "Module state stays separate from Task results"}</span></div><div class="final-pass-grid"><div class="final-pass"><b>Scope PASS</b><span>${lang === "zh" ? "边界锁定" : "boundaries locked"}</span></div><div class="final-pass"><b>AC-01 PASS</b><span>${lang === "zh" ? "路由恢复" : "route recovery"}</span></div><div class="final-pass"><b>AC-02 PASS</b><span>${lang === "zh" ? "回滚审计" : "rollback audited"}</span></div><div class="final-pass"><b>AC-03 PASS</b><span>${lang === "zh" ? "回调幂等" : "idempotent callbacks"}</span></div><div class="final-pass"><b>Note landed</b><span>${lang === "zh" ? "原子落盘" : "atomically landed"}</span></div><div class="final-pass"><b>Closed</b><span>${lang === "zh" ? "流程关闭" : "flow closed"}</span></div></div></div>
        <div class="close-card"><b>${lang === "zh" ? "工作流结束条件" : "Workflow exit condition"}</b><span>${lang === "zh" ? "Main 核对真实结果，回写同一 Task 的进展、证据与 Handoff。模块状态独立维护；代码与相关 Note 一起落地。" : "Main reconciles real results and updates progress, evidence and Handoff in the same Task. Module state stays separate; code and related Notes land together."}</span></div>
      </div>`;
    }

    function tieredFix(progress, expo, clamp, closing = false) {
      const p = clamp(progress);
      const on = (n) => expo(clamp(p * 1.6 - n * 0.3)).toFixed(3);
      const cards = lang === "zh"
        ? [["Repair Packet", "局部缺陷：同 task 最多自动重派发一次，只带失败测试与相关文件。"], ["同一 Task", "主 Agent 回写进展、证据与 Handoff；跨任务问题进入受影响 Task。"], ["直接处理", "架构或范围问题：Main Agent 改 note 或直修。"]]
        : [["Repair Packet", "Local defect: at most one auto re-dispatch with failing tests only."], ["Same Task", "Main updates progress, evidence and Handoff; cross-task issues go to affected Tasks."], ["Direct fix", "Architecture or scope: Main Agent updates notes or fixes directly."]];
      return `<div class="route-options" style="padding:18px">
        ${cards.map((c, i) => `<div class="route-card ${i === 0 ? "active" : ""}" style="--pop:${on(i)}"><b>${c[0]}</b><span>${c[1]}</span></div>`).join("")}
        <div class="route-decision" style="--pop:${on(2)}">${closing ? (lang === "zh" ? "修复关闭 → 原子收口：代码 + Note + 反向注释同 commit" : "Fix closed → atomic landing: code + Note + comment in one commit") : (lang === "zh" ? "默认最多一次自动修复；之后由 Main 判断后续行动" : "At most one automatic repair; Main decides further action")}</div>
      </div>`;
    }

    function iterationLoop(progress, expo, clamp) {
      const p = clamp(progress);
      const on = (start) => expo(clamp((p - start) * 3.2)).toFixed(3);
      const flow = (start) => expo(clamp((p - start) * 4)).toFixed(3);
      const steps = lang === "zh"
        ? [
            ["coderX R1", "按 task AC 生成第一版实现。", ["AC-01 touched", "AC-02 touched"]],
            ["evaluatorX", "独立验收，发现回滚测试和幂等缺口。", ["AC-01 PASS", "AC-02 FIX", "AC-03 FIX"]],
            ["coderX R2", "融合 engineeringX：删重复分支，收敛 guard。", ["engineeringX", "AC-02 repaired"]],
            ["evaluatorX R2", "复读 diff / code / tests，逐条核对 AC。", ["AC-01 PASS", "AC-02 PASS", "AC-03 PASS"]]
          ]
        : [
            ["coderX R1", "Builds the first implementation against task AC.", ["AC-01 touched", "AC-02 touched"]],
            ["evaluatorX", "Finds rollback-test and idempotency gaps.", ["AC-01 PASS", "AC-02 FIX", "AC-03 FIX"]],
            ["coderX R2", "Uses engineeringX: remove duplicate branches, converge guard.", ["engineeringX", "AC-02 repaired"]],
            ["evaluatorX R2", "Re-reads diff, code, and tests against every AC.", ["AC-01 PASS", "AC-02 PASS", "AC-03 PASS"]]
          ];
      return `<div class="iteration-flow">
        ${steps.map((step, i) => {
          const active = p > i * 0.24 ? "active" : "";
          return `<div class="iter-step ${active}" style="--on:${on(i * 0.2)};--flow:${flow(i * 0.22)}">
            <b>${step[0]}</b><span>${step[1]}</span>
            <div class="iter-mini-list">${step[2].map((item) => {
              const cls = item.includes("PASS") ? "pass" : item.includes("FIX") || item.includes("engineeringX") || item.includes("repaired") ? "hot" : "";
              return `<i class="${cls}">${item}</i>`;
            }).join("")}</div>
          </div>`;
        }).join("")}
      </div>`;
    }


    function maintainedNotes() {
      const zh = lang === "zh";
      layout(`<div class="notes-demo">
        <article><h2>${zh ? '一个模块，一份入口' : 'One entry per module'}</h2>
<pre>.agents/notes/
├─ module.md
├─ project-guide.md          note
└─ files/
   ├─ module.md
   ├─ reading-guide.md      note
   └─ parser/
      ├─ module.md
      ├─ batch-import.md   idea
      ├─ error-context.md  decision
      ├─ requirements/read-errors.md
      └─ tasks/read-errors.md</pre></article>
        <article><h2>${zh ? 'xdo：维护已有主题' : 'xdo: maintain an existing topic'}</h2>
          <p class="sample-path">files/reading-guide.md</p>
          <div class="sample-change"><p>${zh ? '之前：保留工作区上下文。' : 'Before: preserve workspace context.'}</p>
          <p>${zh ? '之后：读取失败时也保留当前位置，并提供重试入口。' : 'After: preserve the current location on failure and offer retry.'}</p></div>
          <p>UUID · created · path → ${zh ? '保持不变' : 'unchanged'}<br>updated → ${zh ? '本次维护时间' : 'maintenance time'}</p>
          <p>${zh ? '不新建 Task。仅当出现独立主题或职责时，才新增文档或子模块。' : 'No new Task. Add documents or submodules when a distinct subject or responsibility warrants one.'}</p>
        </article>
        <footer>module · note · idea · requirement · decision · task<br>${zh ? 'Task：Main 在交接前更新进展、证据和 Handoff；子智能体只读，返回结果与草稿。' : 'Task: Main updates progress, evidence and Handoff before dispatch; children read and return results or drafts.'}</footer>
      </div>`, zh ? '目录跟随职责，文档持续维护' : 'Module documents, maintained in place', zh ? '结构与操作示意；真实桌面演示见 JanusX README。' : 'Structure and workflow illustration; see JanusX for the desktop recording.');
    }

    function render(t) {
      if (scene === "notes") maintainedNotes();
      else if (scene === "architecture") architecture();
      else if (scene === "token") token();
      else if (scene === "capabilities") capabilities();
      else workflow(t);
    }

    if (fixedT !== null && Number.isFinite(fixedT)) {
      render(Math.max(0, Math.min(0.999, fixedT)));
    } else {
      let start = null;
      function tick(now) {
        if (start === null) start = now;
        render(((now - start) % 20000) / 20000);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }
  </script>
</body>
</html>
